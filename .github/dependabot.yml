version: 2
updates:
  # Keep the GitHub Actions we use auto-bumped (also moves us toward SHA pins).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # One npm entry per package (separate lockfiles, no root package.json).
  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /playground
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /enablers/pulse-pbi
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /enablers/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # Was missing entirely — found 2026-07-31 when enabling the dependency graph
  # surfaced 20 of the repo's 22 open alerts in this one uncovered package.
  - package-ecosystem: npm
    directory: /enablers/pulse-pbi-gn
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
