command:
  - "bash"
  - "-c"
  - |
    set -e
    echo "[boot] installing playground deps"
    (cd playground && npm ci --no-audit --no-fund)
    echo "[boot] building playground (vite)"
    (cd playground && npm run build)
    echo "[boot] installing proxy deps"
    (cd proxy && npm ci --no-audit --no-fund)
    echo "[boot] starting proxy with STATIC_DIR=playground/dist"
    cd proxy && exec node server.js

env:
  # Auth posture — Databricks Apps gates the URL with platform auth, so the
  # in-proxy mode can be "none". Switch to shared-key/idp for non-Databricks hosts.
  - name: PROXY_AUTH_MODE
    value: "none"

  # Demo persona switching (Planner/Manager "View as"). ON for this demo
  # deployment because no IdP role mapping is wired; an IdP role, when present,
  # always wins and the switch disappears (SEC-01).
  - name: AI_ALLOW_DEMO_PERSONA
    value: "true"

  # Static-serve: relative to repo root (proxy resolves via __dirname + '..').
  - name: STATIC_DIR
    value: "playground/dist"

  # Default Genie profile — the live synthetic LATAM supply-chain POC space
  # (genie-scm-poc), the current demo dataset. Verified live 2026-07-27:
  # space 01f1871d… is one of exactly two spaces this PAT can see. The old
  # "Sample Superstore" space 01f13fe2… no longer exists (deploy would 404).
  - name: PROXY_PROFILE_DEFAULT_HOST
    value: "https://dbc-f88d29ce-4aa2.cloud.databricks.com"
  - name: PROXY_PROFILE_DEFAULT_TOKEN
    valueFrom: databricks-pat
  - name: PROXY_PROFILE_DEFAULT_SPACE_ID
    value: "01f1871d478a181c83cb0562607c3d8e"
  - name: PROXY_PROFILE_DEFAULT_WAREHOUSE_ID
    value: "6510da50329f1e85"
  - name: PROXY_PROFILE_DEFAULT_DISPLAY_NAME
    value: "Genie: Synthetic SCM (POC)"
  - name: PROXY_PROFILE_DEFAULT_DATA_DOMAIN
    value: "synthetic LATAM supply chain — countries, plants, sales channels, OFR/operations/performance facts"
  # All-Databricks Dashboard: the PulsePlay SCM Lakeview dashboard (created
  # 2026-07-29 over main.supply_chain.fact_supply_chain_kpi_monthly — the same
  # fact the decision rules scan). A fresh browser seeds the Dashboard surface
  # to render it NATIVELY through this profile; no workspace token in the browser.
  - name: PROXY_PROFILE_DEFAULT_LAKEVIEW_DASHBOARD_ID
    value: "01f18b1911851e9eb75f3c0bd8fb0120"

  # Second Genie profile — Customer Support Review (the other live space).
  # Kept so the deployed app mirrors the local config.json (genie + genie-scm-poc).
  - name: PROXY_PROFILE_SUPPORT_HOST
    value: "https://dbc-f88d29ce-4aa2.cloud.databricks.com"
  - name: PROXY_PROFILE_SUPPORT_TOKEN
    valueFrom: databricks-pat
  - name: PROXY_PROFILE_SUPPORT_SPACE_ID
    value: "01f1436554b719bea6abd14824c9103e"
  - name: PROXY_PROFILE_SUPPORT_WAREHOUSE_ID
    value: "6510da50329f1e85"
  - name: PROXY_PROFILE_SUPPORT_DISPLAY_NAME
    value: "Genie: Customer Support Review"
  - name: PROXY_PROFILE_SUPPORT_DATA_DOMAIN
    value: "customer support tickets, agents, and reviews"

  # Foundation Model profile — the endpoint that actually exists on this
  # workspace (verified 2026-07-27; the free edition ships 3-3-70b, NOT the
  # 405B this manifest previously named, which would have failed at runtime).
  - name: PROXY_PROFILE_FOUNDATION_TYPE
    value: "foundation-model"
  - name: PROXY_PROFILE_FOUNDATION_HOST
    value: "https://dbc-f88d29ce-4aa2.cloud.databricks.com"
  - name: PROXY_PROFILE_FOUNDATION_TOKEN
    valueFrom: databricks-pat
  - name: PROXY_PROFILE_FOUNDATION_FOUNDATION_MODEL_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: PROXY_PROFILE_FOUNDATION_DISPLAY_NAME
    value: "Foundation Model (Llama 3.3 70B)"

  # NOTE (2026-07-27): supervisor-local removed — it needs ≥2 Genie spaces AND
  # pointed its synthesis at the non-existent 405B endpoint. Re-add only with a
  # live synthesis endpoint if a multi-space fan-out is wanted.

  # 2026-07-29 (user direction): the HOSTED app is the Databricks-only shade.
  # No Power BI profile here - that story (deterministic DAX brain + report
  # embed) remains fully available in local/dev via proxy/config.json, and can
  # be re-added by restoring the profile env block + the SP-secret resource
  # from git history (commit 76e1970).

resources:
  - name: databricks-pat
    description: PAT used by the proxy for all Databricks workspace calls (Genie + warehouse + Foundation Model).
    secret:
      scope: pulseplay
      key: databricks_pat
      permission: READ
